<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>Devine nombre</title>

</head>

<body>

    <main class="mainContainer">
        <h1 class="mainContainer_titre">Devine le nombre</h1>
        <h2 class="mainContainer_consigne">Choisis un numéro entre 1 et 999</h2>

        <div class="mainContainer_ecranDigit"></div>
        <div class="mainContainer_clavier">
            <button class="mainContainer_touche" id="touche0">0</button>
            <button class="mainContainer_touche" id="touche1">1</button>
            <button class="mainContainer_touche" id="touche2">2</button>
            <button class="mainContainer_touche" id="touche3">3</button>
            <button class="mainContainer_touche" id="touche4">4</button>
            <button class="mainContainer_touche" id="touche5">5</button>
            <button class="mainContainer_touche" id="touche6">6</button>
            <button class="mainContainer_touche" id="touche7">7</button>
            <button class="mainContainer_touche" id="touche8">8</button>
            <button class="mainContainer_touche" id="touche9">9</button>
            <button class="mainContainer_toucheEntrer" id="toucheEntrer">Entrer</button>
            <button class="mainContainer_toucheEffacer" id="toucheEffacer">Effacer</button>
            
        </div>
    </main>


<script src="script.js"></script>
</body>

</html>
